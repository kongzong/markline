<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img">
  <title>折叠屏展开态时间线设计图</title>
  <desc>MarkLine 宽屏展开态：单列卡片左文右图（图宽 1/3），白底描边，日期随卡片显示，底栏导航</desc>
  <rect x="0" y="0" width="720" height="720" rx="28" fill="#FFFFFF" stroke="#D9D9D4" stroke-width="2"/>

  <text x="24" y="50" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#2C2C2A">Line</text>
  <g stroke="#5F5E5A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 596 40 h 22 l -8 10 v 9 l -6 3 v -12 z"/>
    <rect x="628" y="41" width="17" height="14" rx="2.5"/>
    <circle cx="633.5" cy="46.5" r="1.8"/>
    <path d="M 628 53.5 l 5 -4 l 4 3.5 l 4 -3 l 4 3.5"/>
    <circle cx="664" cy="48" r="3.2"/>
    <path d="M 664 41.5 v 3 M 664 51.5 v 3 M 657.5 48 h 3 M 667.5 48 h 3 M 659.5 43.5 l 2.1 2.1 M 666.4 50.4 l 2.1 2.1 M 668.5 43.5 l -2.1 2.1 M 661.6 50.4 l -2.1 2.1"/>
  </g>

  <rect x="16" y="66" width="688" height="34" rx="17" fill="#F1EFE8"/>
  <circle cx="34" cy="83" r="6" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path d="M 38.5 87.5 l 5 5" stroke="#888780" stroke-width="1.5" stroke-linecap="round"/>
  <text x="50" y="88" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#888780">搜索备注、地点、主题、日期…</text>

  <!-- 卡片 1：左文右图（图宽约 1/3，圆角，边缘留白） -->
  <g>
    <rect x="16" y="114" width="688" height="240" rx="12" fill="#FFFFFF" stroke="#D8DCE0" stroke-width="1"/>
    <text x="28" y="140" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">14:32</text>
    <text x="82" y="140" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#888780" opacity="0.85">今天 · 10月31日周六</text>
    <g stroke="#888780" stroke-width="1.4" fill="none" opacity="0.6">
      <path d="M 29 151 c -3.5 -3.8 -4.8 -5.8 -4.8 -7.7 a 4.8 4.8 0 1 1 9.6 0 c 0 1.9 -1.3 3.9 -4.8 7.7 z" transform="translate(0,-1)"/>
    </g>
    <text x="42" y="162" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#888780">江滨路附近（约 80 米）</text>
    <rect x="28" y="176" width="380" height="8" rx="4" fill="#F1EFE8"/>
    <rect x="28" y="190" width="320" height="8" rx="4" fill="#F1EFE8"/>
    <rect x="28" y="204" width="260" height="8" rx="4" fill="#F1EFE8"/>
    <rect x="28" y="224" width="46" height="17" rx="4" fill="#E4E4DF" opacity="0.7"/>
    <text x="51" y="236" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#888780" text-anchor="middle">巡检</text>
    <g stroke="#888780" stroke-width="1.4" fill="none" opacity="0.6">
      <circle cx="33" cy="268" r="5.5"/>
      <path d="M 33 264.5 v 4 l 2.6 2" />
    </g>
    <text x="46" y="272" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#888780" opacity="0.7">语音 47秒 · 已转文字</text>
    <!-- 右侧圆角照片：占卡片宽约 1/3 -->
    <clipPath id="w1"><rect x="474" y="124" width="218" height="220" rx="10"/></clipPath>
    <g clip-path="url(#w1)">
      <rect x="474" y="124" width="218" height="220" fill="#9FE1CB"/>
      <circle cx="640" cy="158" r="12" fill="#FAEEDA"/>
      <path d="M 474 322 L 512 268 L 550 312 L 582 284 L 630 330 L 662 306 L 692 340 L 692 344 L 474 344 Z" fill="#0F6E56" opacity="0.75"/>
    </g>
    <rect x="668" y="320" width="15" height="15" rx="4" fill="#000000" opacity="0.4"/>
    <circle cx="674.5" cy="326.5" r="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M 677 329 l 2.5 2.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 卡片 2：左文右图（矮照片） -->
  <g>
    <rect x="16" y="368" width="688" height="150" rx="12" fill="#FFFFFF" stroke="#D8DCE0" stroke-width="1"/>
    <text x="28" y="394" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">09:15</text>
    <text x="82" y="394" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#888780" opacity="0.85">昨天 · 10月30日周五</text>
    <g stroke="#888780" stroke-width="1.4" fill="none" opacity="0.6">
      <path d="M 29 405 c -3.5 -3.8 -4.8 -5.8 -4.8 -7.7 a 4.8 4.8 0 1 1 9.6 0 c 0 1.9 -1.3 3.9 -4.8 7.7 z" transform="translate(0,-1)"/>
    </g>
    <text x="42" y="416" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#888780">会议室</text>
    <rect x="28" y="430" width="300" height="8" rx="4" fill="#F1EFE8"/>
    <rect x="28" y="448" width="46" height="17" rx="4" fill="#E4E4DF" opacity="0.7"/>
    <text x="51" y="460" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#888780" text-anchor="middle">例会</text>
    <clipPath id="w2"><rect x="474" y="378" width="218" height="130" rx="10"/></clipPath>
    <g clip-path="url(#w2)">
      <rect x="474" y="378" width="218" height="130" fill="#B5D4F4"/>
      <path d="M 474 488 L 508 460 L 542 482 L 570 466 L 622 496 L 656 480 L 692 502 L 692 508 L 474 508 Z" fill="#185FA5" opacity="0.7"/>
    </g>
    <rect x="668" y="486" width="15" height="15" rx="4" fill="#000000" opacity="0.4"/>
    <circle cx="674.5" cy="492.5" r="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M 677 495 l 2.5 2.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 卡片 3：纯文字记录（无图卡片文字列与有图卡片左对齐） -->
  <g>
    <rect x="16" y="532" width="688" height="96" rx="12" fill="#FFFFFF" stroke="#D8DCE0" stroke-width="1"/>
    <text x="28" y="558" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">08:40</text>
    <text x="82" y="558" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#888780" opacity="0.85">10月28日周三</text>
    <g stroke="#888780" stroke-width="1.4" fill="none" opacity="0.6">
      <path d="M 29 569 c -3.5 -3.8 -4.8 -5.8 -4.8 -7.7 a 4.8 4.8 0 1 1 9.6 0 c 0 1.9 -1.3 3.9 -4.8 7.7 z" transform="translate(0,-1)"/>
    </g>
    <text x="42" y="580" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#888780">建设路 188 号</text>
    <rect x="28" y="592" width="300" height="8" rx="4" fill="#F1EFE8"/>
  </g>

  <!-- 底部导航：所有屏宽统一底栏 -->
  <g>
    <rect x="0" y="628" width="720" height="1" fill="#E4E4DF"/>
    <g stroke="#888780" stroke-width="1.8" fill="none" stroke-linecap="round">
      <circle cx="220" cy="664" r="9"/>
    </g>
    <text x="220" y="686" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#888780" text-anchor="middle">Mark</text>
    <g stroke="#2F9E44" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M 480 655 h 28 M 480 664 h 28 M 480 673 h 18"/>
    </g>
    <text x="494" y="686" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#2F9E44" text-anchor="middle">Line</text>
  </g>
</svg>
