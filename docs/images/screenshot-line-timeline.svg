<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" role="img">
  <title>Line 时间线界面设计图</title>
  <desc>MarkLine 时间线页面：单列垂直排布，全宽大卡 + 照片横幅 + 日期分组</desc>
  <rect x="0" y="0" width="360" height="760" rx="28" fill="#FFFFFF" stroke="#D9D9D4" stroke-width="2"/>

  <text x="20" y="52" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#2C2C2A">Line</text>
  <g stroke="#5F5E5A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 主题筛选（漏斗） -->
    <path d="M 288 38 h 22 l -8 10 v 9 l -6 3 v -12 z"/>
    <!-- 导入照片 -->
    <rect x="318" y="39" width="17" height="14" rx="2.5"/>
    <circle cx="323.5" cy="44.5" r="1.8"/>
    <path d="M 318 50.5 l 5 -4 l 4 3.5 l 4 -3 l 4 3.5"/>
    <!-- 设置 -->
    <circle cx="342" cy="46" r="3.2"/>
    <path d="M 342 39.5 v 3 M 342 49.5 v 3 M 335.5 46 h 3 M 345.5 46 h 3 M 337.5 41.5 l 2.1 2.1 M 344.4 48.4 l 2.1 2.1 M 346.5 41.5 l -2.1 2.1 M 339.6 48.4 l -2.1 2.1"/>
  </g>

  <rect x="16" y="76" width="328" height="38" rx="19" fill="#F1EFE8"/>
  <circle cx="36" cy="95" r="6" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path d="M 40.5 99.5 l 5 5" stroke="#888780" stroke-width="1.5" stroke-linecap="round"/>
  <text x="52" y="100" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#888780">搜索备注、地点、主题、日期…</text>

  <!-- 日期分组头：日期 + 今天 chip -->
  <text x="20" y="140" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#888780">10月25日</text>
  <rect x="88" y="128" width="36" height="17" rx="4" fill="#E6F6EC"/>
  <text x="106" y="140" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#2F9E44" text-anchor="middle">今天</text>

  <!-- 卡片 1：照片横幅 + 地址 + 备注 + 主题 chip -->
  <g>
    <rect x="16" y="158" width="328" height="228" rx="12" fill="#FFFFFF" stroke="#E4E4DF" stroke-width="1"/>
    <clipPath id="b1"><rect x="17" y="159" width="326" height="106" rx="11"/></clipPath>
    <g clip-path="url(#b1)">
      <rect x="17" y="159" width="326" height="106" fill="#9FE1CB"/>
      <circle cx="290" cy="188" r="12" fill="#FAEEDA"/>
      <path d="M 17 244 L 66 202 L 112 240 L 146 214 L 216 260 L 258 238 L 343 268 L 343 265 L 17 265 Z" fill="#0F6E56" opacity="0.75"/>
    </g>
    <!-- 放大查看角标 -->
    <rect x="324" y="247" width="14" height="14" rx="4" fill="#000000" opacity="0.4"/>
    <circle cx="330" cy="253" r="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M 332.5 255.5 l 2.5 2.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <text x="28" y="290" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">14:32</text>
    <g stroke="#888780" stroke-width="1.4" fill="none" opacity="0.6">
      <path d="M 29 299 c -3.5 -3.8 -4.8 -5.8 -4.8 -7.7 a 4.8 4.8 0 1 1 9.6 0 c 0 1.9 -1.3 3.9 -4.8 7.7 z" transform="translate(0,-1)"/>
    </g>
    <text x="40" y="308" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#888780">江滨路附近（约 80 米）</text>
    <rect x="28" y="318" width="180" height="8" rx="4" fill="#F1EFE8"/>
    <rect x="28" y="332" width="120" height="8" rx="4" fill="#F1EFE8"/>
    <rect x="28" y="348" width="44" height="16" rx="4" fill="#E4E4DF" opacity="0.7"/>
    <text x="50" y="360" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#888780" text-anchor="middle">巡检</text>
  </g>

  <!-- 卡片 2：矮横幅照片 -->
  <g>
    <rect x="16" y="402" width="328" height="164" rx="12" fill="#FFFFFF" stroke="#E4E4DF" stroke-width="1"/>
    <clipPath id="b2"><rect x="17" y="403" width="326" height="68" rx="11"/></clipPath>
    <g clip-path="url(#b2)">
      <rect x="17" y="403" width="326" height="68" fill="#B5D4F4"/>
      <path d="M 17 452 L 62 420 L 104 448 L 138 428 L 210 466 L 254 446 L 343 470 L 343 471 L 17 471 Z" fill="#185FA5" opacity="0.7"/>
    </g>
    <rect x="324" y="491" width="14" height="14" rx="4" fill="#000000" opacity="0.4"/>
    <circle cx="330" cy="497" r="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M 332.5 499.5 l 2.5 2.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <text x="28" y="496" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">09:15</text>
    <g stroke="#888780" stroke-width="1.4" fill="none" opacity="0.6">
      <path d="M 29 505 c -3.5 -3.8 -4.8 -5.8 -4.8 -7.7 a 4.8 4.8 0 1 1 9.6 0 c 0 1.9 -1.3 3.9 -4.8 7.7 z" transform="translate(0,-1)"/>
    </g>
    <text x="40" y="514" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#888780">会议室</text>
    <rect x="28" y="524" width="44" height="16" rx="4" fill="#E4E4DF" opacity="0.7"/>
    <text x="50" y="536" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#888780" text-anchor="middle">例会</text>
  </g>

  <!-- 卡片 3：纯文字记录 -->
  <g>
    <rect x="16" y="582" width="328" height="112" rx="12" fill="#FFFFFF" stroke="#E4E4DF" stroke-width="1"/>
    <text x="28" y="606" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">08:40</text>
    <g stroke="#888780" stroke-width="1.4" fill="none" opacity="0.6">
      <path d="M 29 615 c -3.5 -3.8 -4.8 -5.8 -4.8 -7.7 a 4.8 4.8 0 1 1 9.6 0 c 0 1.9 -1.3 3.9 -4.8 7.7 z" transform="translate(0,-1)"/>
    </g>
    <text x="40" y="624" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#888780">建设路 188 号</text>
    <rect x="28" y="634" width="220" height="8" rx="4" fill="#F1EFE8"/>
    <rect x="28" y="648" width="150" height="8" rx="4" fill="#F1EFE8"/>
    <rect x="28" y="664" width="44" height="16" rx="4" fill="#E4E4DF" opacity="0.7"/>
    <text x="50" y="676" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#888780" text-anchor="middle">走访</text>
  </g>

  <rect x="16" y="710" width="328" height="34" rx="17" fill="#F1EFE8"/>
  <circle cx="164" cy="727" r="8" fill="none" stroke="#888780" stroke-width="1.8"/>
  <path d="M 164 722 a 5 5 0 0 1 0 10" fill="none" stroke="#2F9E44" stroke-width="1.8"/>
  <text x="180" y="732" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#888780">上滑加载更多 · 下拉刷新</text>
</svg>
